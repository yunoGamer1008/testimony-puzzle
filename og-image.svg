      <stop offset="0%" stop-color="#c9a44a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#06090f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#4a82c4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06090f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#06090f"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <!-- Case badge -->
  <rect x="476" y="158" width="248" height="34" rx="2" fill="none" stroke="#c9a44a" stroke-opacity="0.28" stroke-width="1"/>
  <text x="600" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c9a44a" fill-opacity="0.55" letter-spacing="10">CASE FILE</text>
