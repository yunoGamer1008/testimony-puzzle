  <text x="600" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="88" font-weight="700" fill="#c9a44a" letter-spacing="10">証言パズル</text>
  <!-- Ornament line -->
  <line x1="340" y1="338" x2="576" y2="338" stroke="#c9a44a" stroke-opacity="0.22" stroke-width="1"/>
  <polygon points="600,328 610,338 600,348 590,338" fill="#c9a44a" fill-opacity="0.45"/>
  <line x1="624" y1="338" x2="860" y2="338" stroke="#c9a44a" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#7a90aa" letter-spacing="4">証言を読み解き、犯人を暴け</text>
  <!-- Stars -->
  <text x="600" y="470" text-anchor="middle" font-size="18" fill="#c9a44a" fill-opacity="0.3" letter-spacing="16">★ ★ ★</text>
